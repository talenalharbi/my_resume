<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talen Alharbi — Resume</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Your fixed CSS -->
  <style>
    /* =========================================================
       LIGHT YELLOW THEME
    ========================================================= */
    :root{
      --yellow: #fff9e5;
      --yellow2: #fffceb;
      --ink: #163042;
      --muted: #6b7b88;
      --bg: #fffefa;
      --card: #ffffff;
      --border: rgba(22,48,66,.08);
      --shadow: 0 18px 45px rgba(0,0,0,.10);
      --shadowSoft: 0 10px 25px rgba(0,0,0,.08);
      --radius: 22px;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }

    body{
      margin:0;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      color: var(--ink);
      line-height: 1.65;
      background:
        radial-gradient(900px 540px at 12% -10%, rgba(255,230,130,.28), transparent 60%),
        radial-gradient(820px 520px at 95% 0%, rgba(255,245,180,.40), transparent 55%),
        radial-gradient(520px 420px at 30% 85%, rgba(255,250,200,.18), transparent 60%),
        var(--bg);
    }

    a{ text-decoration:none; }
    img{ display:block; max-width:100%; }

    /* =========================================================
       HERO
    ========================================================= */
    .hero{
      position:relative;
      padding: 74px 0 58px;
      overflow:hidden;
      color: #0f2b3b;
      background: linear-gradient(120deg,
        rgba(255,245,180,.85),
        rgba(255,250,200,.75),
        rgba(255,230,130,.88));
    }

    .hero::before,
    .hero::after{
      content:"";
      position:absolute;
      inset:auto;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      pointer-events:none;
      filter: blur(1px);
      opacity:.9;
    }
    .hero::before{
      top:-160px; right:-140px;
      background: radial-gradient(circle, rgba(255,255,255,.55), transparent 66%);
    }
    .hero::after{
      bottom:-200px; left:-160px;
      background: radial-gradient(circle, rgba(255,255,255,.35), transparent 66%);
    }

    .hero-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 28px;
    }

    .hero-text{ max-width: 680px; }

    .hero-badge{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 900;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.92);
      box-shadow: 0 12px 24px rgba(0,0,0,.08);
    }

    .hero-title{
      margin: 12px 0 6px;
      font-weight: 1000;
      letter-spacing:.2px;
      font-size: clamp(2.25rem, 4vw, 3.25rem);
    }

    .hero-subtitle{
      margin:0;
      font-weight: 800;
      color: rgba(15,43,59,.85);
    }

    .hero-actions{
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .hero-btn{
      border-radius: 999px !important;
      font-weight: 1000 !important;
      padding: 10px 18px !important;
      border-width: 2px !important;
      box-shadow: 0 14px 28px rgba(0,0,0,.12);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    .hero-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(0,0,0,.14);
    }

    .btn-primary{
      background: linear-gradient(90deg, #fff8c4, #fffceb) !important;
      border: none !important;
      color: #0f2b3b !important;
    }
    .btn-primary:hover{ filter: brightness(1.03); }

    .btn-outline-light{
      border: 2px solid rgba(255,255,255,.95) !important;
      color: #0f2b3b !important;
      background: rgba(255,255,255,.35) !important;
    }
    .btn-outline-light:hover{
      background: rgba(255,255,255,.70) !important;
    }

    .hero-links{
      display:flex;
      gap: 12px;
      margin-top: 14px;
    }
    .icon-link{
      width: 42px; height: 42px;
      display:grid;
      place-items:center;
      border-radius: 999px;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.92);
      color: #0f2b3b;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
      transition: transform .16s ease;
    }
    .icon-link:hover{ transform: translateY(-2px) rotate(-3deg); }

    .profile-img{
      position: absolute;
      top: 25px;
      right: 40px;
      width: 90px;  /* small profile */
      height: 90px; /* small profile */
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,.9);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    .hero-wave{
      position:absolute;
      left:0; right:0; bottom:-1px;
      height: 58px;
      background:
        radial-gradient(62px 62px at 31px 0, var(--bg) 98%, transparent 100%) repeat-x;
      background-size: 124px 58px;
    }

    /* Navbar, sections, cards, forms, back-to-top same as your original CSS */
  </style>

</head>
<body>

  <!-- HERO -->
  <header class="hero" id="top">

    <img src="images/profile-small.jpg" 
         alt="Talen Alharbi profile picture" 
         class="profile-img" />

    <div class="container hero-inner">
      <div class="hero-text">

        <span class="badge hero-badge">Available for Internship • 2026</span>

        <h1 class="hero-title">Talen Alharbi</h1>

        <p class="hero-subtitle">
          Software Engineering Student • Web Development • UI/UX
        </p>

        <div class="hero-actions">
          <a class="btn btn-primary hero-btn" href="#projects">
            <i class="fa-solid fa-folder-open me-2"></i>View Projects
          </a>
          <a class="btn btn-outline-light hero-btn" href="#contact">
            <i class="fa-solid fa-paper-plane me-2"></i>Contact Me
          </a>
        </div>

        <div class="hero-links" aria-label="Social links">
          <a href="https://www.linkedin.com/in/talen-alharbi-3ab130346" class="icon-link" target="_blank" rel="noopener">
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a href="https://github.com/talenalharbi" class="icon-link" target="_blank" rel="noopener">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="mailto:talen.alharbi@uj.edu.sa" class="icon-link">
            <i class="fa-solid fa-envelope"></i>
          </a>
        </div>

      </div>
    </div>

    <div class="hero-wave" aria-hidden="true"></div>
  </header>

  <!-- Navbar, Main Sections (About, Education, Projects, Contact), Footer -->
  <!-- Copy your previous main content here unchanged -->

</body>
</html>
